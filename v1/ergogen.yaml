pcbs:
  nest:
    template: kicad8
    footprints:
      # --- KEY SWITCHES & DIODES ---
      keys:
        what: ceoloide/switch_mx
        where:
          - /matrix_.*/
          - /thumb_.*/
        params:
          from: "{{colrow}}"
          to: "diodes_{{name}}_from"
          reversible: true
          solder: true
          include_keycap: true
      
      diodes:
        what: ceoloide/diode_tht_sod123
        where:
          - /matrix/
          - /thumb/
        params:
          from: "diodes_{{name}}_from"
          to: "{{row}}"
          reversible: true
          side: B

      # --- MICROCONTROLLER ---
      mcu:
        what: ceoloide/mcu_nice_nano
        where: [mcu]
        params:
          reversible: true
          only_required_jumpers: true
          P7: matrix_pinky_top
          P18: matrix_ring_top
          P19: matrix_middle_top
          P20: matrix_index_top
          P21: matrix_inner_top
          P15: matrix_pinky_home
          P14: matrix_ring_home
          P16: matrix_middle_home
          P10: matrix_index_home
          P1: matrix_inner_home
          P2: matrix_pinky_bottom
          P3: matrix_ring_bottom
          P4: matrix_middle_bottom
          P5: matrix_index_bottom
          P6: matrix_inner_bottom
          P8: thumb_tuck
          P9: thumb_reach
          RST: reset_net
          GND: GND
          VCC: raw_battery_pos

      # --- NICE!VIEW DISPLAY ---
      display:
        what: ceoloide/display_nice_view # Standard 5-pin nice!view pinout definition
        where: [display]
        params:
          reversible: true
          # Connects to the standard nice!view pin headers
          VCC: raw_battery_pos
          GND: GND
          # Dedicated 3-wire SPI communication lines mapped to nice!nano pins
          CS: P006   # Typical CS pin configuration mapping (change according to your firmware)
          MOSI: P008  # MOSI data pin mapping
          SCK: P017  # SCK clock pin mapping

      # --- HARDWARE PERIPHERALS ---
      reset_switch:
        what: ceoloide/reset_switch_smd_side
        where:
          ref: matrix_inner_home
          rotate: -90
          shift: [1.5px, -1py]
        params:
          from: reset_net
          to: GND
          side: B

      power_switch:
        what: ceoloide/power_switch_smd_side
        where:
          ref: matrix_inner_home
          rotate: 0
          shift: [1.5px, -1.5py]
        params:
          from: jst_pos_net
          to: raw_battery_pos
          side: B

      jst_battery_connector:
        what:  ceoloide/battery_connector_jst_ph_2
        where:
          ref: matrix_inner_home
          rotate: -90
          shift: [1px, -1.5py]
        params:
          side: B